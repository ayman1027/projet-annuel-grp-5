<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Classification d'images</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Classification d'Images</h1>
<p class="sous-titre">Avion / Voiture / Bateau</p>

<div class="carte">
    <div class="zone-upload" onclick="document.getElementById('image').click()">
        <label class="btn-upload">Choisir une image</label>
        <input type="file" id="image" accept="image/*" onchange="afficherNom()">
        <p id="nom-fichier">Aucun fichier choisi</p>
    </div>

    <select id="modele">
        <option value="lineaire">Modele Lineaire</option>
        <option value="pmc">PMC</option>
        <option value="rbfn">RBFN</option>
    </select>

    <button onclick="classifier()">Classifier</button>
</div>

<div id="resultat">
    <img id="apercu" src="" alt="image">
    <div id="prediction"></div>
    <div class="scores">
        <div class="score-item" id="score-avion">
            <div class="label">Avion</div>
            <div class="valeur" id="val-avion">-</div>
        </div>
        <div class="score-item" id="score-voiture">
            <div class="label">Voiture</div>
            <div class="valeur" id="val-voiture">-</div>
        </div>
        <div class="score-item" id="score-bateau">
            <div class="label">Bateau</div>
            <div class="valeur" id="val-bateau">-</div>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
